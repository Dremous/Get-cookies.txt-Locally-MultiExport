name: Test

on:
  push:
    branches: ["**"]
  workflow_dispatch:
  workflow_call:

jobs:
  unit:
    name: Unit tests and checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Run unit tests
        run: npm test

  firefox-e2e:
    name: Firefox save pipeline E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FIREFOX_VERSION: "160.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install pinned Firefox
        run: |
          FIREFOX_BIN=$(./node_modules/.bin/browsers install "firefox@stable_${FIREFOX_VERSION}" --path "$RUNNER_TEMP/firefox" --format "{{path}}")
          echo "FIREFOX_BIN=$FIREFOX_BIN" >> "$GITHUB_ENV"
      - name: Verify pinned Firefox
        run: |
          "$FIREFOX_BIN" --version
      - name: Run Firefox E2E
        run: xvfb-run -a npm run test:firefox

  chrome-e2e:
    name: Chrome save pipeline E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CHROME_VERSION: "158.0.8127.36"

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install pinned Chrome for Testing
        run: |
          CHROME_BIN=$(./node_modules/.bin/browsers install "chrome@${CHROME_VERSION}" --path "$RUNNER_TEMP/chrome" --format "{{path}}")
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Verify pinned Chrome
        run: |
          "$CHROME_BIN" --version
      - name: Run Chrome E2E
        run: xvfb-run -a npm run test:chrome
