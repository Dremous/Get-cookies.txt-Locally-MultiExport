name: Test

on:
  push:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests and checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Run unit tests
        run: npm test

  firefox-e2e:
    name: Firefox save pipeline E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run Firefox E2E
        run: npm run test:firefox

  chrome-e2e:
    name: Chrome save pipeline E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Chrome for Testing
        run: |
          CHROME_BIN=$(./node_modules/.bin/browsers install chrome@stable --path "$RUNNER_TEMP/chrome" --format "{{path}}")
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Run Chrome E2E
        run: xvfb-run -a npm run test:chrome
