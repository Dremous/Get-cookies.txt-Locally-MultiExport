name: Publish Firefox add-on

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish; must match package.json (for example 0.8.12)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: amo-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Full test suite
    uses: ./.github/workflows/test.yml

  publish:
    name: Submit listed version to AMO
    needs: test
    environment: amo
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify version and release tag
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$EXPECTED_VERSION" != "$VERSION" ]; then
            echo "::error::Manual version '$EXPECTED_VERSION' does not match package.json version '$VERSION'."
            exit 1
          fi
          git fetch --tags --force
          TAG="v${VERSION}"
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}" >/dev/null; then
            echo "::error::Missing release tag ${TAG}; create and push the tag before publishing."
            exit 1
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(git rev-parse "${TAG}^{commit}")
          if [ "$HEAD_SHA" != "$TAG_SHA" ]; then
            echo "::error::Tag ${TAG} points to ${TAG_SHA}, but HEAD is ${HEAD_SHA}."
            exit 1
          fi

      - name: Run checks and tests
        run: |
          npm run check
          npm test

      - name: Build Firefox package
        run: npm run build:firefox

      - name: Prepare AMO package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          rm -rf .amo-package
          unzip -q "dist/get-cookies.txt-locally_v${VERSION}_firefox.zip" -d .amo-package

      - name: Check AMO credentials
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::Missing AMO_API_KEY or AMO_API_SECRET repository secret."
            exit 1
          fi
          if [[ ! "$WEB_EXT_API_KEY" =~ ^user:[0-9]+:[0-9]+$ ]]; then
            echo "::error::AMO_API_KEY must be the JWT issuer (for example user:12345:67), not the JWT secret. See https://addons.mozilla.org/developers/addon/api/key/"
            exit 1
          fi

      - name: Submit listed version
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          ./node_modules/.bin/web-ext sign \
            --source-dir=.amo-package \
            --channel=listed \
            --amo-metadata=amo-metadata.json \
            --approval-timeout=0
